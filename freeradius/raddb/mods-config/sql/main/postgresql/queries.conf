# Tenant-aware FreeRADIUS SQL Queries
# NAS IP adresine göre tenant_id eşleşmesi yapılır

# ============================================
# Authorization Queries
# ============================================

authorize_check_query = "\
    SELECT rc.id, rc.username, rc.attribute, rc.value, rc.op \
    FROM radcheck rc \
    INNER JOIN nas_devices nd ON nd.tenant_id = rc.tenant_id \
    WHERE rc.username = '%{SQL-User-Name}' \
    AND nd.ip_address = '%{NAS-IP-Address}' \
    AND nd.is_active = true \
    ORDER BY rc.id"

authorize_reply_query = "\
    SELECT rr.id, rr.username, rr.attribute, rr.value, rr.op \
    FROM radreply rr \
    INNER JOIN nas_devices nd ON nd.tenant_id = rr.tenant_id \
    WHERE rr.username = '%{SQL-User-Name}' \
    AND nd.ip_address = '%{NAS-IP-Address}' \
    AND nd.is_active = true \
    ORDER BY rr.id"

authorize_group_check_query = "\
    SELECT rgc.id, rgc.groupname, rgc.attribute, rgc.value, rgc.op \
    FROM radgroupcheck rgc \
    INNER JOIN radusergroup rug ON rug.groupname = rgc.groupname AND rug.tenant_id = rgc.tenant_id \
    INNER JOIN nas_devices nd ON nd.tenant_id = rgc.tenant_id \
    WHERE rug.username = '%{SQL-User-Name}' \
    AND nd.ip_address = '%{NAS-IP-Address}' \
    AND nd.is_active = true \
    ORDER BY rgc.id"

authorize_group_reply_query = "\
    SELECT rgr.id, rgr.groupname, rgr.attribute, rgr.value, rgr.op \
    FROM radgroupreply rgr \
    INNER JOIN radusergroup rug ON rug.groupname = rgr.groupname AND rug.tenant_id = rgr.tenant_id \
    INNER JOIN nas_devices nd ON nd.tenant_id = rgr.tenant_id \
    WHERE rug.username = '%{SQL-User-Name}' \
    AND nd.ip_address = '%{NAS-IP-Address}' \
    AND nd.is_active = true \
    ORDER BY rgr.id"

group_membership_query = "\
    SELECT rug.groupname \
    FROM radusergroup rug \
    INNER JOIN nas_devices nd ON nd.tenant_id = rug.tenant_id \
    WHERE rug.username = '%{SQL-User-Name}' \
    AND nd.ip_address = '%{NAS-IP-Address}' \
    AND nd.is_active = true \
    ORDER BY rug.priority"

# ============================================
# Accounting Queries
# ============================================

accounting_onoff_query = "\
    UPDATE radacct \
    SET acctstoptime = now(), \
        acctterminatecause = '%{Acct-Terminate-Cause}' \
    WHERE acctstoptime IS NULL \
    AND nasipaddress = '%{NAS-IP-Address}'"

accounting_update_query = "\
    UPDATE radacct \
    SET acctupdatetime = now(), \
        framedipaddress = '%{Framed-IP-Address}', \
        acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}'::bigint * 4294967296 + '%{Acct-Input-Octets}', \
        acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}'::bigint * 4294967296 + '%{Acct-Output-Octets}' \
    WHERE acctsessionid = '%{Acct-Session-Id}' \
    AND username = '%{SQL-User-Name}' \
    AND nasipaddress = '%{NAS-IP-Address}'"

accounting_start_query = "\
    INSERT INTO radacct \
        (acctsessionid, username, nasipaddress, nasportid, \
         acctstarttime, acctupdatetime, framedipaddress, \
         callingstationid, calledstationid, \
         acctinputoctets, acctoutputoctets, tenant_id) \
    SELECT \
        '%{Acct-Session-Id}', '%{SQL-User-Name}', '%{NAS-IP-Address}', \
        '%{NAS-Port-Id}', now(), now(), '%{Framed-IP-Address}', \
        '%{Calling-Station-Id}', '%{Called-Station-Id}', \
        0, 0, nd.tenant_id \
    FROM nas_devices nd \
    WHERE nd.ip_address = '%{NAS-IP-Address}' \
    AND nd.is_active = true \
    LIMIT 1"

accounting_stop_query = "\
    UPDATE radacct \
    SET acctstoptime = now(), \
        acctterminatecause = '%{Acct-Terminate-Cause}', \
        framedipaddress = '%{Framed-IP-Address}', \
        acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}'::bigint * 4294967296 + '%{Acct-Input-Octets}', \
        acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}'::bigint * 4294967296 + '%{Acct-Output-Octets}' \
    WHERE acctsessionid = '%{Acct-Session-Id}' \
    AND username = '%{SQL-User-Name}' \
    AND nasipaddress = '%{NAS-IP-Address}'"

# ============================================
# Post-Auth Queries
# ============================================

post-auth {
    query = "\
        INSERT INTO radpostauth \
            (username, pass, reply, authdate, nasipaddress, tenant_id) \
        SELECT \
            '%{SQL-User-Name}', '%{%{User-Password}:-%{Chap-Password}}', \
            '%{reply:Packet-Type}', now(), '%{NAS-IP-Address}', nd.tenant_id \
        FROM nas_devices nd \
        WHERE nd.ip_address = '%{NAS-IP-Address}' \
        AND nd.is_active = true \
        LIMIT 1"
}

# ============================================
# NAS/Client Query (read_clients = yes)
# ============================================

client_query = "\
    SELECT nd.id, nd.ip_address AS nasname, nd.secret AS secret, \
           nd.name AS shortname, nd.type AS type \
    FROM nas_devices nd \
    WHERE nd.is_active = true"
