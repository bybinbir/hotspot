upstream api_backend {
    server api:3001;
}

upstream admin_frontend {
    server admin:3000;
}

# API: api.onspot.com.tr
server {
    listen 80;
    server_name api.onspot.com.tr;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Super Admin: admin.onspot.com.tr
server {
    listen 80;
    server_name admin.onspot.com.tr;

    location / {
        proxy_pass http://admin_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Captive Portal: portal.*.onspot.com.tr -> NestJS /portal/
server {
    listen 80;
    server_name ~^portal\.(?<tenant_slug>.+)\.onspot\.com\.tr$;

    location / {
        proxy_pass http://api_backend/portal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;
    }
}

# Tenant Admin: *.onspot.com.tr
server {
    listen 80;
    server_name ~^(?<tenant_slug>.+)\.onspot\.com\.tr$;

    location / {
        proxy_pass http://admin_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;
    }
}
